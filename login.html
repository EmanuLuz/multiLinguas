<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi Línguas | Entrar</title>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <main class="login-container">

    <div class="login-illustration">
      <div class="illustration-logo">
        <i>A文</i>
        Multi Línguas
      </div>
      <div class="illustration-content">
        <h2>Bem-vindo de volta!</h2>
        <p>Acesse sua conta e continue sua jornada de aprendizado.</p>
      </div>
    </div>

    <div class="login-form-container">
      <div class="form-header">
        <h1>Entrar</h1>
        <p>Não tem conta? <a href="criarConta.html">Cadastre-se</a></p>
      </div>

      <form id="loginForm" novalidate>

        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="seu@email.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="Sua senha" required />
            <button type="button" class="toggle-password" aria-label="Mostrar senha">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" />
            <span class="checkmark"><i class="fas fa-check"></i></span>
            Lembrar de mim
          </label>
          <a href="#" class="forgot-link">Esqueceu a senha?</a>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn-login">
          <span class="spinner"></span>
          Entrar
        </button>
      </form>

      <div class="form-footer">
        Ao entrar você concorda com nossos <strong>Termos</strong>.
      </div>
    </div>

  </main>

  <div id="toast"></div>

  <!-- verificar se precisa ter para o axios funcionar -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
