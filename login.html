<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi Línguas | Entrar</title>
  <link rel="stylesheet" href="css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">
  <div class="background-shapes">
    <span class="shape shape-1"></span>
    <span class="shape shape-2"></span>
    <span class="shape shape-3"></span>
  </div>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">
          <span class="logo-icon">🌐</span>
          <h1>Multi Línguas</h1>
        </div>
        <p class="subtitle">Entre na sua conta</p>
      </div>

      <form id="form-login" class="auth-form" novalidate>
        <div class="input-group">
          <label for="email-login">E-mail</label>
          <input type="email" id="email-login" placeholder="seu@email.com" required />
          <span class="error-msg" id="erro-login"></span>
        </div>

        <div class="input-group">
          <label for="senha-login">Senha</label>
          <input type="password" id="senha-login" placeholder="Sua senha" required />
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <p class="auth-footer">
        Não tem conta? <a href="criarConta.html">Criar conta</a>
      </p>
    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
