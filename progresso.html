<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajuste de Vocabulário - multiLinguas</title>
  <link rel="stylesheet" href="css/vocabulario.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1><i class="fas fa-book-open"></i> Ajuste de Vocabulário e Leitura</h1>
      <p>Personalize a complexidade da linguagem e a acessibilidade visual para seus estudos.</p>
    </header>

    <!-- Formulário Compacto -->
    <section class="card-form">
      <div class="card-title">
        <i class="fas fa-sliders-h"></i>
        <h2>Configurar Preferências</h2>
      </div>
      <form id="formVocabulario">
        <div class="form-grid">
          <div class="form-group">
            <label for="estiloVocabulario">Estilo de Vocabulário</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-language"></i>
              <select id="estiloVocabulario" required>
                <option value="simples">Simples (Fácil entendimento)</option>
                <option value="formal">Formal (Profissional)</option>
                <option value="academico">Acadêmico (Avançado)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="tamanhoFonte">Tamanho da Fonte (px)</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-text-height"></i>
              <input type="number" id="tamanhoFonte" min="12" max="28" value="16" required>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary">
          <i class="fas fa-save"></i> Salvar Preferência
        </button>
      </form>
    </section>

    <!-- Tabela do Histórico -->
    <section class="table-card">
      <div class="table-header">
        <h2><i class="fas fa-history"></i> Histórico de Ajustes</h2>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Data/Hora</th>
              <th>Estilo</th>
              <th>Tamanho da Fonte</th>
              <th style="text-align: center;">Ação</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo">
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/vocabulario.js"></script>
</body>
</html>
